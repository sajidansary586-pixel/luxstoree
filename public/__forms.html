<!-- Static form skeleton for Netlify Forms build-time detection (SSR app) -->
<html>
  <body>
    <form name="order-notification" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="order-notification" />
      <input name="bot-field" />
      <input name="order-id" />
      <input name="customer-name" />
      <input name="phone" />
      <input name="email" />
      <input name="address" />
      <input name="items" />
      <input name="total" />
      <input name="payment-ref" />
    </form>
  </body>
</html>
